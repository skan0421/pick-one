name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# 같은 브랜치(PR)에 새 커밋이 오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 배포판·의존성·빌드 캐시 (main 에서만 캐시를 쓰고, PR 은 읽기만 한다)
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      # ubuntu 러너에는 Docker 엔진이 기본 설치되어 있어 Testcontainers 가 MariaDB·Redis 컨테이너를 직접 띄운다
      - name: Docker 확인
        run: docker version

      # JWT·휴대폰 암호화 키는 TestSecretsConfiguration 이 테스트 JVM 마다 랜덤 생성하므로 Secrets 가 필요 없다
      - name: 테스트
        run: ./gradlew test

      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 14
