name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# 같은 브랜치(PR)에 새 커밋이 오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: JDK 17 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 배포판·의존성·빌드 캐시 (main 에서만 캐시를 쓰고, PR 은 읽기만 한다)
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v5

      # ubuntu 러너에는 Docker 엔진이 기본 설치되어 있어 Testcontainers 가 MariaDB·Redis 컨테이너를 직접 띄운다
      - name: Docker 확인
        run: docker version

      # JWT·휴대폰 암호화 키는 TestSecretsConfiguration 이 테스트 JVM 마다 랜덤 생성하므로 Secrets 가 필요 없다
      - name: 테스트
        run: ./gradlew test

      # JUnit XML 을 집계해 테스트 수를 로그와 Job Summary 에 남긴다 (Gradle 기본 출력에는 개수가 없음)
      - name: 테스트 결과 요약
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          for f in glob.glob('build/test-results/test/*.xml'):
              r = ET.parse(f).getroot()
              total += int(r.get('tests', 0)); failures += int(r.get('failures', 0))
              errors += int(r.get('errors', 0)); skipped += int(r.get('skipped', 0))
          line = f"tests={total} passed={total - failures - errors - skipped} failures={failures} errors={errors} skipped={skipped}"
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"### 테스트 결과\n\n`{line}`\n")
          PY

      # 테스트가 실패해도 리포트를 만든다 (test 의 finalizedBy 이지만 명시적으로 한 번 더 보장)
      - name: 커버리지 리포트 (JaCoCo)
        if: always()
        run: ./gradlew jacocoTestReport

      # JaCoCo XML 의 전체 LINE / BRANCH 카운터를 % 로 계산해 Job Summary 에 남긴다. 최소 기준은 두지 않는다
      - name: 커버리지 요약
        if: always()
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          path = 'build/reports/jacoco/test/jacocoTestReport.xml'
          if not os.path.exists(path):
              print('커버리지 리포트 없음'); raise SystemExit(0)
          root = ET.parse(path).getroot()
          totals = {c.get('type'): (int(c.get('missed')), int(c.get('covered'))) for c in root.findall('counter')}
          def pct(t):
              m, c = totals.get(t, (0, 0)); return (100.0 * c / (m + c)) if (m + c) else 0.0, c, m + c
          line, lc, lt = pct('LINE'); branch, bc, bt = pct('BRANCH')
          text = f"line={line:.1f}% ({lc}/{lt}) branch={branch:.1f}% ({bc}/{bt})"
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write("### 커버리지 (JaCoCo)\n\n| 라인 | 브랜치 |\n|---|---|\n")
              out.write(f"| {line:.1f}% ({lc}/{lt}) | {branch:.1f}% ({bc}/{bt}) |\n")
          PY

      - name: 커버리지 리포트 업로드 (항상)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
          retention-days: 14

      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 14

  # Expo 앱(app/) 타입 검사와 린트.
  # test 작업과 마찬가지로 paths 필터를 두지 않는다. 필수 체크로 지정된 작업이 필터로 건너뛰어지면
  # 결과가 보고되지 않아 PR 이 계속 대기 상태로 남기 때문이다
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5

      - name: Node 22 설정
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # package-lock.json 에 적힌 버전 그대로 설치
      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 린트
        run: npm run lint
