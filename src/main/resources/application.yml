spring:
  application:
    name: pickone

  profiles:
    # 프로필을 지정하지 않으면 local 로 동작 (application-local.yml 은 git 미추적)
    default: local

  datasource:
    # 실제 값은 환경변수 또는 application-local.yml 로 주입
    url: ${DB_URL:jdbc:mariadb://localhost:3307/pickone}
    username: ${DB_USERNAME:pickone}
    password: ${DB_PASSWORD:}

  data:
    redis:
      # Refresh 토큰, (이후) OTP·일회용 code 저장소
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  jpa:
    hibernate:
      # 스키마는 Flyway 가 관리하고, JPA 는 엔티티-테이블 일치 여부만 검증
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    # 응답에서 null 필드는 생략 (ErrorResponse.errors 등)
    default-property-inclusion: non_null

# OpenAPI 문서. pickone.swagger.enabled 하나로 문서·UI·보안 예외를 함께 켜고 끈다 (운영: SWAGGER_ENABLED=false)
springdoc:
  api-docs:
    enabled: ${pickone.swagger.enabled}
  swagger-ui:
    enabled: ${pickone.swagger.enabled}
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    # Hibernate 가 기동 시 DB URL 을 비밀번호 포함 평문으로 INFO 출력하므로 숨김
    org.hibernate.orm.connections.pooling: WARN
    # local/test 의 가짜 SMS 발송기가 인증번호 본문을 남기는 레벨. 실제 발송 구현에는 영향 없음
    com.pickone.phone.sms.LoggingSmsSender: DEBUG

pickone:
  cors:
    # /api/** 허용 origin (쉼표 구분). 기본은 Expo 웹 개발 서버. 운영은 CORS_ALLOWED_ORIGINS 로 앱 웹 도메인 지정 (docs/api.md 1.9)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}

  swagger:
    # 기본 꺼짐. 로컬은 application-local.yml 에서 켜고, 필요하면 SWAGGER_ENABLED=true 환경변수로도 켤 수 있다
    enabled: ${SWAGGER_ENABLED:false}

  jwt:
    # HS256 비밀키. 32바이트 이상. 환경변수 또는 application-local.yml 로 주입 (기본값 없음)
    secret: ${JWT_SECRET}
    access-token-ttl: 30m
    refresh-token-ttl: 14d

  otp:
    # SMS 인증번호 정책 (docs/api.md 3.1)
    code-length: 6
    ttl: 3m
    max-attempts: 5
    cooldown: 1m
    daily-limit-per-phone: 5
    daily-limit-per-member: 10

  point:
    # 포인트 정책 (docs/api.md 1.7). wallet-max-retries 는 지갑 낙관적 락 충돌 시 재시도 횟수 (총 시도 = 1 + 값)
    vote-reward: 1
    daily-earn-limit: 50
    boost-cost: 100
    boost-duration: 24h
    wallet-max-retries: 3

  report:
    # 같은 고민의 RECEIVED 신고가 이 수 이상이면 자동 HIDDEN (docs/api.md 8.4)
    auto-hide-threshold: 5

  hide:
    # 연락처 업로드 상한과 JDBC 배치 크기 (docs/api.md 7.1)
    max-contacts: 5000
    batch-size: 1000

  storage:
    # S3 호환 객체 저장소 (로컬 MinIO, 운영 S3). 접속 정보는 환경변수 또는 application-local.yml 로 주입 (기본값 없음)
    endpoint: ${STORAGE_ENDPOINT}
    bucket: ${STORAGE_BUCKET}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    region: ${STORAGE_REGION:ap-northeast-2}
    # 앱이 이미지를 읽는 주소 접두사 (CDN 이 있으면 CDN). 비어 있으면 {endpoint}/{bucket}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    # 사진 업로드 정책 (docs/api.md 4.6)
    max-image-size: 5MB
    presign-ttl: 5m
    allowed-content-types: image/jpeg,image/png,image/webp

  crypto:
    # 휴대폰 번호 AES-GCM 키(Base64 32바이트)와 HMAC-SHA256 키(32바이트 이상). 서로 다른 값. 환경변수 주입, 기본값 없음
    phone-aes-key: ${PHONE_AES_KEY}
    phone-hmac-key: ${PHONE_HMAC_KEY}
