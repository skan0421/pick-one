spring:
  application:
    name: pickone

  profiles:
    # 프로필을 지정하지 않으면 local 로 동작 (application-local.yml 은 git 미추적)
    default: local

  datasource:
    # 실제 값은 환경변수 또는 application-local.yml 로 주입
    url: ${DB_URL:jdbc:mariadb://localhost:3307/pickone}
    username: ${DB_USERNAME:pickone}
    password: ${DB_PASSWORD:}

  data:
    redis:
      # Refresh 토큰, (이후) OTP·일회용 code 저장소
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  jpa:
    hibernate:
      # 스키마는 Flyway 가 관리하고, JPA 는 엔티티-테이블 일치 여부만 검증
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    # 응답에서 null 필드는 생략 (ErrorResponse.errors 등)
    default-property-inclusion: non_null

logging:
  level:
    # Hibernate 가 기동 시 DB URL 을 비밀번호 포함 평문으로 INFO 출력하므로 숨김
    org.hibernate.orm.connections.pooling: WARN

pickone:
  jwt:
    # HS256 비밀키. 32바이트 이상. 환경변수 또는 application-local.yml 로 주입 (기본값 없음)
    secret: ${JWT_SECRET}
    access-token-ttl: 30m
    refresh-token-ttl: 14d
