services:
  mariadb:
    image: mariadb:11.4
    container_name: pickone-mariadb
    restart: unless-stopped
    ports:
      # 로컬에 다른 MySQL 이 3306 을 쓰는 경우가 많아 기본 3307 로 노출
      - "${DB_PORT:-3307}:3306"
    environment:
      MARIADB_DATABASE: ${DB_NAME:-pickone}
      MARIADB_USER: ${DB_USERNAME:-pickone}
      MARIADB_PASSWORD: ${DB_PASSWORD:?.env 파일에 DB_PASSWORD 를 설정하세요}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?.env 파일에 DB_ROOT_PASSWORD 를 설정하세요}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    container_name: pickone-redis
    restart: unless-stopped
    ports:
      # 다른 프로젝트 Redis 가 6379 를 쓰는 경우가 있어 기본 6380 으로 노출
      - "${REDIS_PORT:-6380}:6379"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO 공식 이미지(minio/minio, quay.io)는 2026-09 기준 더 이상 받아지지 않아 Bitnami legacy 이미지를 쓴다 (docs/troubleshooting.md 14)
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: pickone-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?.env 파일에 MINIO_ROOT_USER 를 설정하세요}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?.env 파일에 MINIO_ROOT_PASSWORD 를 설정하세요 (8자 이상)}
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  # 버킷 생성 + images/* 접두사만 익명 읽기 허용 (ListBucket 은 열지 않는다). 한 번 실행 후 종료
  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    container_name: pickone-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-pickone-images}
    volumes:
      - ./docker/minio/public-read-images.json:/policy/public-read-images.json:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/$$STORAGE_BUCKET &&
      sed \"s/pickone-images/$$STORAGE_BUCKET/\" /policy/public-read-images.json > /tmp/policy.json &&
      mc anonymous set-json /tmp/policy.json local/$$STORAGE_BUCKET &&
      echo 'MinIO 버킷·정책 준비 완료'
      "

volumes:
  mariadb-data:
  minio-data:
